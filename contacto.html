<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Contacta con los mejores si tienes alguna duda"
    />
    <title>Contacto - MolowStyle</title>
  </head>

  <body>
    <header>
      <div class="container">
        <a href="index.html" class="logo">MolowStyle</a>
        <nav>
          <ul>
            <li class="nav-item">
              <a href="index.html">Inicio</a>
            </li>
            <li class="nav-item"><a href="catalogo.html">Catálogo</a></li>
            <li class="nav-item">
              <a href="contacto.html" aria-current="page">Contacto</a>
            </li>
            <li class="nav-item">
              <a href="sobre-nosotros.html">Sobre Nosotros</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
    <main>
      <section>
        <div class="container">
          <h1 class="contact">Contacta con nosotros</h1>
          <form action="/contact" method="post">
            <div class="form-group">
              <label for="nombre">Nombre </label>
              <input
                type="text"
                id="nombre"
                name="nombre"
                required
                minlength="3"
                maxlength="50"
              />
            </div>
            <div class="form-group">
              <label for="email">Correo electronico</label>
              <input type="email" id="email" name="email" required />
            </div>
            <div class="form-group">
              <label for="tel">Telefono de contacto</label>
              <input type="tel" id="tel" name="tel" pattern="[0-9]{10}" />
            </div>

            <div class="form-group">
              <label for="motivo">Motivo de contacto</label>
              <select id="motivo" name="motivo" required>
                <option value="">Elige un motivo</option>
                <option value="pedido">Pedido retrasado</option>
                <option value="idea">Idea de prenda</option>
                <option value="working">Trabaja con nosotros</option>
                <option value="otro">Otro</option>
              </select>
            </div>
            <div class="form-group">
              <label for="mensaje">Mensaje</label>
              <textarea
                id="mensaje"
                name="mensaje"
                rows="5"
                required
                minlength="10"
                maxlength="1000"
                placeholder="En que te podemos ayudar"
              ></textarea>
            </div>

            <fieldset>
              <legend>¿Como deseas que te contactemos?</legend>
              <input
                type="radio"
                id="por-whatsapp"
                name="contacto"
                value="whatsapp"
              />
              <label for="por-whatsapp">WhatsApp</label>
              <input
                type="radio"
                id="por-correo"
                name="contacto"
                value="correo"
              />
              <label for="por-correo">Correo electronico</label>
            </fieldset>
            <input
              type="checkbox"
              id="datos"
              name="tratamiento-de-datos"
              required
            />
            <label for="datos">Acepto el tratamiento de datos</label>
            <button type="submit">Enviar</button>
          </form>
        </div>
      </section>
    </main>
    <footer>
      <div class="container">
        <a
          href="https://www.tiktok.com/@molowstyle/"
          class="btn-tiktok"
          target="_blank"
          rel="noopener noreferrer"
          >Síguenos en TikTok</a
        >
        <a
          href="https://www.instagram.com/molowstyle/"
          class="btn-instagram"
          target="_blank"
          rel="noopener noreferrer"
          >Síguenos en Instagram</a
        >
        <a
          href="https://wa.me/573053155888"
          class="btn-whatsapp"
          target="_blank"
          rel="noopener noreferrer"
          >Contáctanos por WhatsApp</a
        >
      </div>
    </footer>
  </body>
</html>
